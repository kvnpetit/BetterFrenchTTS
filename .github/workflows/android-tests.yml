name: Android emulator tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tests:
    name: Android tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: ['26', '37.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Reuse the preceding build job's cache without duplicating cache uploads.
          cache-read-only: true
      - name: Prepare test APKs before starting the emulator
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :better-french-tts:assembleDebugAndroidTest --console=plain --max-workers=2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute instrumented tests on Android
        env:
          API_LEVEL: ${{ matrix.api-level }}
        run: bash .github/scripts/android-tests.sh
      - name: Upload Android test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            better-french-tts/build/reports/androidTests/
            better-french-tts/build/outputs/androidTest-results/
            build/emulator-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
