name: Release Please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build release AAR
        run: ./gradlew :better-french-tts:assembleRelease

      - name: Upload AAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: better-french-tts/build/outputs/aar/*.aar

  deploy-docs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Extract version number
        id: version
        run: echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Restore version archive from gh-pages
        run: |
          mkdir -p /tmp/dokka-older
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add /tmp/gh-pages origin/gh-pages
            if [ -d /tmp/gh-pages/_versions ]; then
              cp -r /tmp/gh-pages/_versions/* /tmp/dokka-older/ 2>/dev/null || true
            fi
            git worktree remove /tmp/gh-pages --force
          fi

      - name: Generate KDoc with Dokka
        run: ./gradlew :better-french-tts:dokkaGeneratePublicationHtml -PdokkaVersion=${{ steps.version.outputs.number }} -PdokkaOlderVersionsDir=/tmp/dokka-older

      - name: Prepare deployment with archive
        run: |
          VERSION=${{ steps.version.outputs.number }}
          mkdir -p /tmp/deploy

          # Root = latest docs (with dropdown via Dokka's older/)
          cp -r better-french-tts/build/dokka/html/* /tmp/deploy/

          # Preserve existing version archive
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add /tmp/gh-pages2 origin/gh-pages
            if [ -d /tmp/gh-pages2/_versions ]; then
              cp -r /tmp/gh-pages2/_versions /tmp/deploy/
            fi
            git worktree remove /tmp/gh-pages2 --force
          fi

          # Archive this version (without older/ to avoid duplication)
          mkdir -p /tmp/deploy/_versions/$VERSION
          cp -r better-french-tts/build/dokka/html/* /tmp/deploy/_versions/$VERSION/
          rm -rf /tmp/deploy/_versions/$VERSION/older

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/deploy
