name: Deploy KDoc to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Fetch older versions from gh-pages
        run: |
          git fetch origin gh-pages || true
          mkdir -p /tmp/dokka-older
          git worktree add /tmp/gh-pages origin/gh-pages 2>/dev/null || true
          if [ -d /tmp/gh-pages ]; then
            for dir in /tmp/gh-pages/*/; do
              version=$(basename "$dir")
              if [[ "$version" =~ ^[0-9]+\. ]]; then
                cp -r "$dir" /tmp/dokka-older/
              fi
            done
            git worktree remove /tmp/gh-pages --force 2>/dev/null || true
          fi

      - name: Generate KDoc with Dokka
        run: ./gradlew :better-french-tts:dokkaGeneratePublicationHtml -PdokkaVersion=dev -PdokkaOlderVersionsDir=/tmp/dokka-older

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: better-french-tts/build/dokka/html
          keep_files: true
