name: Verify Better French TTS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
      - name: Build, test and verify publication
        run: >-
          ./gradlew checkKotlinFormat assemble testDebugUnitTest lint
          :app:assembleDebugAndroidTest
          :better-french-tts:assembleDebugAndroidTest
          :better-french-tts:dokkaGeneratePublicationHtml
          :better-french-tts:publishToMavenLocal
          -Pversion=2.1.0
      - name: Upload build and unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            better-french-tts/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  android-tests:
    uses: ./.github/workflows/android-tests.yml
