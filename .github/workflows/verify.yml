name: Verify Better French TTS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test and verify publication
        run: >-
          ./gradlew checkKotlinFormat assemble testDebugUnitTest lint
          :app:assembleDebugAndroidTest
          :better-french-tts:assembleDebugAndroidTest
          :better-french-tts:dokkaGeneratePublicationHtml
          :better-french-tts:publishToMavenLocal
          -Pversion=2.1.2
      - name: Verify documentation features
        shell: bash
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          bash scripts/test-docs.sh "$RUNNER_TEMP/docs-script-tests"
          bash scripts/check-docs.sh
      - name: Rehearse the release documentation pipeline without publishing
        shell: bash
        run: bash scripts/build-docs.sh dev "$GITHUB_SHA" "$RUNNER_TEMP/verify-docs"
      - name: Upload build and unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/
            better-french-tts/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  android-tests:
    needs: verify
    uses: ./.github/workflows/android-tests.yml
