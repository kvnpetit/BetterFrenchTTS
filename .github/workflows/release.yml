name: Publish release artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  android-tests:
    needs: build-release
    uses: ./.github/workflows/android-tests.yml

  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag and changelog
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v2.0.0 or v2.0.0-rc.1" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          grep -Fq "## [$VERSION] - " CHANGELOG.md || {
            echo "Add a dated changelog entry for $VERSION before releasing." >&2
            exit 1
          }
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify and build release AAR
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: >-
          ./gradlew checkKotlinFormat assemble testDebugUnitTest lint
          :app:assembleDebugAndroidTest :better-french-tts:assembleDebugAndroidTest
          "-Pversion=$RELEASE_VERSION" --console=plain

      - name: Preserve the verified release AAR
        uses: actions/upload-artifact@v7
        with:
          name: release-aar
          path: better-french-tts/build/outputs/aar/better-french-tts-release.aar
          if-no-files-found: error
          retention-days: 7

      - name: Upload build reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-build-reports
          path: |
            app/build/reports/
            better-french-tts/build/reports/
          retention-days: 7

  publish-aar:
    needs: [build-release, android-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-aar
          path: release-artifact
      - name: Upload AAR to the manually published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release-artifact/better-french-tts-release.aar --clobber

  deploy-docs:
    needs: [build-release, publish-aar]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and verify versioned documentation
        shell: bash
        run: bash scripts/build-docs.sh "$RELEASE_VERSION" "v$RELEASE_VERSION" "$RUNNER_TEMP/release-docs"

      - name: Deploy stable documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/release-docs/deploy
