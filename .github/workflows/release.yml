name: Publish release artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  android-tests:
    uses: ./.github/workflows/android-tests.yml

  build-release:
    needs: android-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag and changelog
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v2.0.0 or v2.0.0-rc.1" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          grep -Fq "## [$VERSION] - " CHANGELOG.md || {
            echo "Add a dated changelog entry for $VERSION before releasing." >&2
            exit 1
          }
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5

      - name: Verify and build release AAR
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: ./gradlew assemble testDebugUnitTest lint "-Pversion=$RELEASE_VERSION"

      - name: Upload AAR to the manually published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" better-french-tts/build/outputs/aar/better-french-tts-release.aar --clobber

  deploy-docs:
    needs: build-release
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5

      - name: Restore documentation archive
        run: |
          mkdir -p "$RUNNER_TEMP/docs-archive" "$RUNNER_TEMP/dokka-older" "$RUNNER_TEMP/docs-deploy"
          if [[ -n "$(git ls-remote --heads origin gh-pages)" ]]; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            if git cat-file -e origin/gh-pages:_versions 2>/dev/null; then
              git archive origin/gh-pages _versions | tar -x -C "$RUNNER_TEMP/docs-archive"
              for archived in "$RUNNER_TEMP/docs-archive/_versions/"*; do
                if [[ -d "$archived" && "$(basename "$archived")" != "$RELEASE_VERSION" ]]; then
                  cp -a "$archived" "$RUNNER_TEMP/dokka-older/"
                fi
              done
            fi
          fi

      - name: Generate versioned documentation
        run: >-
          ./gradlew :better-french-tts:dokkaGeneratePublicationHtml
          "-PdokkaVersion=$RELEASE_VERSION"
          "-PdokkaOlderVersionsDir=$RUNNER_TEMP/dokka-older"

      - name: Prepare deployment and preserve previous versions
        run: |
          cp -a better-french-tts/build/dokka/html/. "$RUNNER_TEMP/docs-deploy/"
          if [[ -d "$RUNNER_TEMP/docs-archive/_versions" ]]; then
            cp -a "$RUNNER_TEMP/docs-archive/_versions" "$RUNNER_TEMP/docs-deploy/"
          fi
          mkdir -p "$RUNNER_TEMP/docs-deploy/_versions/$RELEASE_VERSION"
          tar -C better-french-tts/build/dokka/html --exclude='./older' -cf - . |
            tar -x -C "$RUNNER_TEMP/docs-deploy/_versions/$RELEASE_VERSION"

      - name: Deploy stable documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/docs-deploy
